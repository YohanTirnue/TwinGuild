servers:
  # Example server configuration
  # Copy this template and replace with your actual server IDs
  - id: "YOUR_MAIN_SERVER_ID_HERE"
    name: "Main Server"
    enabled: true

    logging:
      log_server_id: "YOUR_LOG_SERVER_ID_HERE"
      channels:
        message_log: "YOUR_MESSAGE_LOG_CHANNEL_ID"
        voice_log: "YOUR_VOICE_LOG_CHANNEL_ID"
        admin_log: ""  # Optional
        moderation_log: ""  # Optional

    features:
      message_logging:
        enabled: true
        log_deletes: true
        log_edits: true
        log_bulk_deletes: true
        preserve_attachments: true
        extract_urls: true
      voice_logging:
        enabled: true
        log_joins: true
        log_leaves: true
        log_switches: true
        log_mutes: false
        log_deafens: false
      moderation_logging:
        enabled: false
        log_bans: true
        log_kicks: true
        log_timeouts: true
        log_role_changes: true
      member_logging:
        enabled: false
        log_joins: true
        log_leaves: true
        log_nickname_changes: true
      reaction_logging:
        enabled: false
        log_adds: true
        log_removes: true

    filters:
      ignore_bots: true
      ignore_channels: []
      ignore_users: []
      ignore_roles: []
      monitor_only_channels: []
      monitor_only_users: []

    settings:
      message_cache_limit: 200
      max_file_size_mb: 25
      timezone: "UTC"
      log_format:
        include_server_name: true
        include_timestamps: true
        include_user_avatar: false

  # Add more servers below by copying the template above
  # Example:
  # - id: "ANOTHER_SERVER_ID"
  #   name: "Secondary Server"
  #   enabled: true
  #   ...
